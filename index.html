<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Study AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20242c;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:680px;margin:auto;padding:25px 18px}h1{font-size:30px;line-height:1.25}.muted{color:#7a8290;font-size:14px;line-height:1.6}.card{background:white;border:1px solid #e8ebef;border-radius:18px;padding:19px;margin:15px 0}.upload{display:block;text-align:center;padding:28px;border:1.5px dashed #cbd2df;border-radius:14px;background:#fbfcfe}label{font-size:13px;color:#7a8290}input,select{width:100%;padding:12px;border:1px solid #e8ebef;border-radius:10px;background:white;margin-top:6px}button{padding:14px;border:0;border-radius:12px;background:#315efb;color:white;font-weight:700;width:100%;margin-top:13px}.opt{display:block;text-align:left;background:white;color:#20242c;border:1px solid #e8ebef;margin:8px 0}.good{background:#effaf5;border-color:#16845b}.bad{background:#fff4f4;border-color:#c44747}.hidden{display:none}.thumb{width:65px;height:75px;object-fit:cover;margin:5px;border-radius:8px}.bar{height:5px;background:#eee;margin:14px 0}.bar span{display:block;height:5px;background:#315efb}.feedback{background:#f3f5f8;padding:12px;border-radius:10px;font-size:13px;margin-top:12px}.secondary{background:white;color:#333;border:1px solid #ddd}
</style><main><div style="font-weight:800;margin-bottom:28px">Study AI <span style="float:right;color:#315efb;font-size:12px">PHOTO TO QUIZ</span></div>
<section id="home"><h1>사진으로 만들고,<br>퀴즈로 익히다.</h1><p class="muted">교과서·필기·프린트를 올리면 AI가 분석해 맞춤형 문제를 만들어요.</p><div class="card"><b>01. 학습 자료 업로드</b><label class="upload" for="files" style="display:block;margin-top:14px;cursor:pointer">＋<br><b>사진 선택하기</b><br><small>최대 8장 · JPG, PNG, WEBP</small></label><input id="files" type="file" accept="image/*" multiple style="display:none"><div id="thumbs"></div></div>
<div class="card"><b>02. 퀴즈 설정</b><div style="display:flex;gap:10px"><label style="flex:1">문제 수<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label style="flex:1">난이도<select id="level"><option value="adaptive">AI 자동 조절</option><option value="basic">기본 개념</option><option value="advanced">고난도</option></select></label></div><div style="display:flex;gap:10px;margin-top:10px"><label style="flex:1">유형<select id="type"><option value="mixed">혼합형</option><option value="choice">객관식</option><option value="ox">OX</option><option value="short">단답형</option></select></label><label style="flex:1">과목<input id="subject" placeholder="예: 한국사"></label></div><button id="make" disabled>AI 퀴즈 생성하기</button><p id="status" class="muted"></p></div></section>
<section id="quiz" class="hidden"><div class="card"><div id="countline" class="muted"></div><div class="bar"><span id="progress"></span></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" disabled>다음 문제</button></div><button class="secondary" id="quit">종료</button></section>
<section id="result" class="hidden"><div class="card"><h1>학습 결과</h1><h2 id="score" style="text-align:center;font-size:40px"></h2><p id="summary" class="muted"></p><button id="wrong">오답 다시 풀기</button><button class="secondary" id="again">새 퀴즈 만들기</button></div><div class="card" id="review"></div></section><p class="muted" style="font-size:11px;text-align:center">업로드한 사진은 AI 분석을 위해 서버로 전송됩니다. 개인정보가 포함된 자료는 올리지 마세요.</p></main>
<script>
const $=x=>document.getElementById(x);let pics=[],qs=[],answers=[],i=0;
function page(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
async function shrink(f){let u=URL.createObjectURL(f),im=new Image();im.src=u;await im.decode();let s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.8)}
$('files').onchange=async e=>{for(let f of e.target.files){if(pics.length===8)break;if(f.type.startsWith('image/'))pics.push(await shrink(f))}$('thumbs').innerHTML=pics.map(x=>`<img class="thumb" src="${x}">`).join('');$('make').disabled=!pics.length;e.target.value=''};
$('make').onclick=async()=>{ $('make').disabled=true;$('status').textContent='자료를 분석하고 문제를 만들고 있어요…';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:pics,count:+$('count').value,level:$('level').value,type:$('type').value,subject:$('subject').value})}),d=await r.json();if(!r.ok)throw Error(d.error);qs=d.questions;answers=[];i=0;page('quiz');draw()}catch(e){$('status').textContent=e.message;$('make').disabled=false}};
function draw(){let q=qs[i];$('countline').textContent=`${i+1} / ${qs.length} · ${{choice:'객관식',ox:'OX',short:'단답형'}[q.type]}`;$('progress').style.width=(i/qs.length*100)+'%';$('question').textContent=q.question;$('options').innerHTML='';$('feedback').classList.add('hidden');$('next').disabled=true;if(q.type==='short'){let inp=document.createElement('input');inp.placeholder='정답 입력';let b=document.createElement('button');b.textContent='확인';b.onclick=()=>check(inp.value);$('options').append(inp,b)}else q.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.label;b.onclick=()=>check(o.value);$('options').append(b)});$('next').textContent=i===qs.length-1?'결과 보기':'다음 문제'}
function check(v){if(answers[i])return;let q=qs[i],ok=q.type==='short'?String(v).trim().toLowerCase()===q.answer.trim().toLowerCase():String(v)===q.answer;answers[i]={ok};if(q.type!=='short')[...$('options').children].forEach((b,j)=>{if(String(q.options[j].value)===q.answer)b.classList.add('good');else if(String(q.options[j].value)===String(v))b.classList.add('bad');b.disabled=true});else [...$('options').children].forEach(x=>x.disabled=true);$('feedback').textContent=(ok?'정답! ':'정답: '+q.answerLabel+'. ')+(q.explanation||'');$('feedback').classList.remove('hidden');$('next').disabled=false}
$('next').onclick=()=>{if(++i<qs.length)draw();else finish()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function finish(){let n=answers.filter(x=>x.ok).length;$('score').textContent=`${n} / ${qs.length}`;$('summary').textContent=`정답률 ${Math.round(n/qs.length*100)}%`;$('review').innerHTML='<b>문제별 결과</b>'+qs.map((q,j)=>`<p>${j+1}. ${esc(q.question)}<br><span style="color:${answers[j].ok?'#16845b':'#c44747'}">${answers[j].ok?'정답':'오답'} · ${esc(q.answerLabel||q.answer)}</span><br><small>${esc(q.explanation||'')}</small></p>`).join('');$('wrong').disabled=!answers.some(x=>!x.ok);page('result')}
$('wrong').onclick=()=>{qs=qs.filter((q,j)=>!answers[j].ok);answers=[];i=0;page('quiz');draw()};$('again').onclick=()=>page('home');$('quit').onclick=()=>page('home');
</script></html>
